<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catatan Biosolar</title>

<style>
body{
  font-family: Arial;
  background:#f5f5f5;
  padding:10px;
}
h2{text-align:center;}

.container{
  background:#fff;
  padding:15px;
  border-radius:10px;
  box-shadow:0 0 5px rgba(0,0,0,0.1);
}

input,button{
  width:100%;
  padding:10px;
  margin:5px 0;
  font-size:16px;
}

button{
  background:#007bff;
  color:white;
  border:none;
  border-radius:5px;
}

.data{
  background:#fff;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
}

.total{
  background:#e9f7ef;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<h2>CATATAN BIOSOLAR</h2>

<div class="total" id="total"></div>

<div class="container">
  <input type="text" id="nomor" placeholder="Nomor" readonly>
  <input type="text" id="nama" placeholder="Nama (opsional)" oninput="this.value=this.value.toUpperCase()">
  <input type="number" id="liter" placeholder="Liter" inputmode="numeric">
  <input type="text" id="uang" placeholder="Uang" inputmode="numeric">
  <button onclick="simpanData()">Simpan Data</button>
</div>

<div id="list"></div>

<script>
const STORAGE_KEY = 'data_biosolar';
let editIndex = null;

function formatUang(angka){
  return Number(angka).toLocaleString('id-ID');
}

function ambilAngka(val){
  return parseInt(val.replace(/[^0-9]/g,''))||0;
}

function setNomor(){
  let data = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
  document.getElementById('nomor').value = data.length+1;
}

function simpanData(){
  let data = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');

  const nomor = document.getElementById('nomor').value;
  const nama = document.getElementById('nama').value;
  const liter = parseFloat(document.getElementById('liter').value)||0;
  const uang = ambilAngka(document.getElementById('uang').value);

  if(liter<=0){
    alert("Liter harus diisi");
    return;
  }

  if(uang<=0){
    alert("Uang harus diisi");
    return;
  }

  const harga = liter * 11000;
  const dex = Math.floor(liter/100)*50000;
  const total = harga + dex;
  const kembali = uang - total;

  const item = {nomor,nama,liter,harga,dex,total,uang,kembali};

  if(editIndex!==null){
    if(confirm("Edit data ini?")){
      data[editIndex] = item;
      editIndex = null;
    }else{return;}
  }else{
    data.push(item);
  }

  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

  document.getElementById('nama').value='';
  document.getElementById('liter').value='';
  document.getElementById('uang').value='';

  tampilkanData();
  setNomor();
}

function tampilkanData(){
  let data = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
  let html='';

  let totalLiter=0,totalHarga=0,totalDex=0;

  data.forEach((d,i)=>{
    totalLiter+=d.liter;
    totalHarga+=d.harga;
    totalDex+=d.dex;

    html+=`
    <div class="data" onclick="editData(${i})">
      <b>No:</b> ${d.nomor}<br>
      <b>Nama:</b> ${d.nama||'-'}<br>
      <b>Liter:</b> ${d.liter}<br>
      <b>Harga:</b> Rp ${formatUang(d.harga)}<br>
      <b>DEX:</b> Rp ${formatUang(d.dex)}<br>
      <b>Total:</b> Rp ${formatUang(d.total)}<br>
      <b>Uang:</b> Rp ${formatUang(d.uang)}<br>
      <b>Kembali:</b> Rp ${formatUang(d.kembali)}<br><br>
      <button onclick="event.stopPropagation();hapusData(${i})">🗑️</button>
    </div>
    `;
  });

  document.getElementById('list').innerHTML = html;

  document.getElementById('total').innerHTML=`
    <b>Total Data:</b> ${data.length}<br>
    <b>Total Liter:</b> ${totalLiter}<br>
    <b>Total Harga:</b> Rp ${formatUang(totalHarga)}<br>
    <b>Total DEX:</b> Rp ${formatUang(totalDex)}<br>
    <b>Total Semua:</b> Rp ${formatUang(totalHarga+totalDex)}
  `;
}

function hapusData(i){
  if(confirm("Hapus data ini?")){
    let data = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
    data.splice(i,1);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    tampilkanData();
    setNomor();
  }
}

function editData(i){
  let data = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
  let d = data[i];

  if(confirm("Edit data ini?")){
    document.getElementById('nomor').value=d.nomor;
    document.getElementById('nama').value=d.nama;
    document.getElementById('liter').value=d.liter;
    document.getElementById('uang').value=formatUang(d.uang);
    editIndex=i;
  }
}

document.getElementById('uang').addEventListener('input',function(){
  let angka = ambilAngka(this.value);
  this.value = formatUang(angka);
});

setNomor();
tampilkanData();
</script>

</body>
</html>
