<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CATATAN BIOSOLAR</title>

<style>
body {font-family:Arial; background:#111; color:#fff; padding:15px;}
input,button {
  padding:12px; margin:5px 0; width:100%;
  font-size:16px; border-radius:6px; border:none;
}
button {background:#28a745; color:white;}
.hapus {background:#dc3545;}
.hapus-kecil {
  width:auto; padding:4px 8px; font-size:12px;
}
table {
  width:100%; margin-top:10px;
  border-collapse:collapse; font-size:13px;
}
th,td {border:1px solid #444; padding:6px; text-align:center;}
#summary {
  background:#1e1e1e; padding:10px; border-radius:8px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<h2>CATATAN BIOSOLAR</h2>

<div id="summary">
  Total Data: <span id="totalData">0</span> |
  Total Liter: <span id="totalLiter">0</span> |
  Total DEX: Rp <span id="totalDex">0</span> |
  Total Nominal: Rp <span id="totalNominal">0</span>
</div>

<input id="nama" placeholder="Nama (opsional)" oninput="this.value=this.value.toUpperCase()">
<input id="liter" type="number" inputmode="numeric" placeholder="Liter" oninput="hitung()">
<input id="harga" readonly placeholder="Harga">
<input id="dex" readonly placeholder="DEX">
<input id="total" readonly placeholder="Total">

<input id="uang" inputmode="numeric" placeholder="Uang" oninput="formatUang(this); hitung()">
<input id="kembali" readonly placeholder="Kembalian">

<button onclick="simpanData()">Tambah / Update Data</button>
<button class="hapus" onclick="hapusSemua()">Hapus Semua</button>

<table>
<thead>
<tr>
<th>No</th>
<th>Nama</th>
<th>Liter</th>
<th>Harga</th>
<th>DEX</th>
<th>Total</th>
<th>Uang</th>
<th>Kembali</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="tabel"></tbody>
</table>

<script>
const hargaPerLiter = 11000;
let editIndex = -1;

function formatRupiah(angka){
  return angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
}

function formatUang(input){
  let angka = input.value.replace(/\D/g,'');
  input.value = formatRupiah(angka);
}

function hitung(){
  const liter = parseFloat(document.getElementById('liter').value)||0;
  const uang = parseFloat(document.getElementById('uang').value.replace(/\./g,''))||0;

  const harga = liter * hargaPerLiter;
  const dex = Math.floor(liter / 100) * 50000;
  const total = harga + dex;
  const kembali = uang - total;

  document.getElementById('harga').value = formatRupiah(harga);
  document.getElementById('dex').value = formatRupiah(dex);
  document.getElementById('total').value = formatRupiah(total);
  document.getElementById('kembali').value = formatRupiah(kembali);
}

function simpanData(){
  const nama = document.getElementById('nama').value;
  const liter = parseFloat(document.getElementById('liter').value)||0;
  const harga = liter * hargaPerLiter;
  const dex = Math.floor(liter / 100) * 50000;
  const total = harga + dex;
  const uang = parseFloat(document.getElementById('uang').value.replace(/\./g,''))||0;
  const kembali = uang - total;

  if(liter <= 0) return alert("Liter harus diisi");

  let data = JSON.parse(localStorage.getItem('data')||'[]');

  if(editIndex >= 0){
    if(confirm("Edit data ini?")){
      data[editIndex] = {nama,liter,harga,dex,total,uang,kembali};
      editIndex = -1;
    } else return;
  } else {
    data.push({nama,liter,harga,dex,total,uang,kembali});
  }

  localStorage.setItem('data',JSON.stringify(data));
  resetForm();
  tampilkan();
}

function tampilkan(){
  const data = JSON.parse(localStorage.getItem('data')||'[]');
  const tabel = document.getElementById('tabel');
  tabel.innerHTML = "";

  let totalLiter = 0;
  let totalNominal = 0;
  let totalDex = 0;

  data.forEach((d,i)=>{
    totalLiter += d.liter;
    totalNominal += d.total;
    totalDex += d.dex;

    tabel.innerHTML += `
    <tr onclick="editData(${i})">
      <td>${i+1}</td>
      <td>${d.nama}</td>
      <td>${d.liter}</td>
      <td>${formatRupiah(d.harga)}</td>
      <td>${formatRupiah(d.dex)}</td>
      <td>${formatRupiah(d.total)}</td>
      <td>${formatRupiah(d.uang)}</td>
      <td>${formatRupiah(d.kembali)}</td>
      <td>
        <button class="hapus-kecil" onclick="event.stopPropagation(); hapusData(${i})">🗑</button>
      </td>
    </tr>`;
  });

  document.getElementById('totalData').innerText = data.length;
  document.getElementById('totalLiter').innerText = totalLiter;
  document.getElementById('totalNominal').innerText = formatRupiah(totalNominal);
  document.getElementById('totalDex').innerText = formatRupiah(totalDex);
}

function editData(i){
  if(!confirm("Edit data ini?")) return;

  const data = JSON.parse(localStorage.getItem('data'));
  const d = data[i];

  document.getElementById('nama').value = d.nama;
  document.getElementById('liter').value = d.liter;
  document.getElementById('uang').value = formatRupiah(d.uang);

  editIndex = i;
  hitung();
}

function hapusData(i){
  if(!confirm("Hapus data ini?")) return;

  let data = JSON.parse(localStorage.getItem('data'));
  data.splice(i,1);
  localStorage.setItem('data',JSON.stringify(data));
  tampilkan();
}

function hapusSemua(){
  if(confirm("Hapus semua data?")){
    localStorage.removeItem('data');
    tampilkan();
  }
}

function resetForm(){
  document.getElementById('nama').value='';
  document.getElementById('liter').value='';
  document.getElementById('harga').value='';
  document.getElementById('dex').value='';
  document.getElementById('total').value='';
  document.getElementById('uang').value='';
  document.getElementById('kembali').value='';
}

window.onload = tampilkan;
</script>

</body>
</html>
